services:
  app:
    build:
      context: .
      args:
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in Dokploy}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?Set NEXT_PUBLIC_LIVEKIT_URL in Dokploy}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://samjho:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}@postgres:5432/samjho
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Dokploy}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in Dokploy}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?Set GUEST_SESSION_SECRET in Dokploy}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in Dokploy}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in Dokploy}
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL in Dokploy}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?Set NEXT_PUBLIC_LIVEKIT_URL in Dokploy}
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: samjho
      POSTGRES_USER: samjho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samjho -d samjho"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.12.0
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in Dokploy}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in Dokploy}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "7880"
      - "6789"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

volumes:
  postgres-data:
