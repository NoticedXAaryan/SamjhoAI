name: CI / Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          GUEST_SESSION_SECRET: ci-only-guest-secret-0123456789abcdef0123456789
          BETTER_AUTH_URL: http://localhost:3000
          LIVEKIT_API_KEY: ci-key
          LIVEKIT_API_SECRET: ci-only-livekit-secret-0123456789abcdef
          NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
          LIVEKIT_URL: http://localhost:7880
          DATABASE_URL: postgresql://user:password@localhost:5432/samjho


